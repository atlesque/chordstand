<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Chordstand</title>
		<meta name="description" content="Generate, rearrange and save piano song structures on your phone. A minimal, offline-friendly web app: no accounts, everything stays in your browser." />
		<meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d0c13" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="preload" href="%sveltekit.assets%/fonts/syne.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script>
			try {
				var p = JSON.parse(localStorage.getItem('chordstand:v1:prefs') || '{}');
				if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
